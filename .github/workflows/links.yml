name: Markdown links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check internal markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --exclude-path node_modules
            --exclude-path src-tauri/target
            --exclude-path dist
            '*.md'
            'docs/**/*.md'
            '.github/**/*.md'
          fail: true
