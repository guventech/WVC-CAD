name: Tauri build (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Enable Corepack (packageManager npm)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: cargo audit (non-blocking)
        continue-on-error: true
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: src-tauri/target/release/bundle/nsis/**
          if-no-files-found: error
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
