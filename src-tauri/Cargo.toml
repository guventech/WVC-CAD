[package]
name = "wvc-cad"
version = "0.1.0-alpha.2"
description = "WVC-CAD — parametric 2D mechanical sketcher (Tauri shell)"
authors = ["WVC-CAD"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
